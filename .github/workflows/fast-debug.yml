name: Fast Debug & Error Catcher 🚀

on:
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر متى شئت

jobs:
  build:
    name: Build & Catch Errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # الإصدار المعتمد لتطبيقات الأندرويد الحديثة
          distribution: 'temurin'

      - name: Setup Gradle with Caching ⚡
        uses: gradle/actions/setup-gradle@v3
        # هذا السطر السحري هو ما يجعل البناء سريعاً جداً في المرات القادمة

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK & Show Exact Errors 🎯
        # استخدمنا --stacktrace لكي يطبع الخطأ الجذري (اسم الملف المكرر)
        run: ./gradlew assembleDebug --stacktrace

        
      - name: Upload Debug APK 📦
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-Translation-Test
          path: app/build/outputs/apk/debug/*.apk
        
